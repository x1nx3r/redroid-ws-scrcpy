services:
  redroid:
    image: redroid/redroid:12.0.0_64only-latest
    privileged: true
    ports:
      - "0.0.0.0:5555:5555"
    volumes:
      - ./data:/data
    command:
      - androidboot.redroid_width=720
      - androidboot.redroid_height=1280
      - androidboot.redroid_dpi=320
      - androidboot.redroid_fps=30
      - androidboot.use_memfd=1
      - androidboot.redroid_gpu_mode=host
      - androidboot.redroid_gpu_node=/dev/dri/renderD128
    # DO NOT use "unless-stopped": a boot-time start panics the kernel
    # while the Rust binder driver is in use. See README.
    restart: "no"

  ws-scrcpy:
    build:
      context: ./ws-scrcpy
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - REDROID_HOSTS=redroid:5555
    depends_on:
      - redroid
    restart: "no"
